<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, maximum-scale=2.0, viewport-fit=cover">
  <title>Турнирная сетка · до 30 команд</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0b0f1c 0%, #1a1f33 100%);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      color: #e9eef3;
    }

    .glass-panel {
      background: rgba(18, 22, 40, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 3rem;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
      padding: 2rem 2rem 2.2rem;
      max-width: 1400px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    h1 {
      font-weight: 700;
      font-size: 2.4rem;
      letter-spacing: -0.5px;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }

    .badge {
      background: #fbbf24;
      color: #0f172a;
      padding: 0.3rem 1.2rem;
      border-radius: 3rem;
      font-size: 1.3rem;
      font-weight: 800;
      -webkit-text-fill-color: #0f172a;
      background-clip: border-box;
      box-shadow: 0 8px 20px rgba(251, 191, 36, 0.4);
    }

    .controls-grid {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 1.2rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 2rem;
      padding: 1.2rem 1.5rem;
    }

    .select-wrapper {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      background: #0f1322;
      border-radius: 2.5rem;
      padding: 0.3rem 0.3rem 0.3rem 1.2rem;
      border: 1px solid #2d3548;
    }

    .select-wrapper label {
      font-weight: 600;
      color: #94a3b8;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    select {
      background: #1e2538;
      border: none;
      border-radius: 2rem;
      padding: 0.7rem 1.8rem 0.7rem 1.2rem;
      color: #f1f5f9;
      font-weight: 600;
      font-size: 1rem;
      outline: none;
      cursor: pointer;
      appearance: none;
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%23facc15" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>');
      background-repeat: no-repeat;
      background-position: right 0.8rem center;
    }

    .team-list-editor {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.7rem;
      flex: 2;
      min-width: 280px;
    }

    .team-list-editor input {
      background: #0f1322;
      border: 1px solid #2d3548;
      border-radius: 2.5rem;
      padding: 0.7rem 1.2rem;
      color: #f1f5f9;
      font-weight: 500;
      font-size: 0.95rem;
      outline: none;
      flex: 3;
      min-width: 180px;
      transition: 0.25s;
    }

    .team-list-editor input:focus {
      border-color: #facc15;
      box-shadow: 0 0 0 3px rgba(250, 204, 21, 0.25);
    }

    .btn {
      background: #facc15;
      color: #0f172a;
      font-weight: 700;
      border: none;
      border-radius: 2.5rem;
      padding: 0.7rem 1.4rem;
      font-size: 0.9rem;
      letter-spacing: 0.3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      box-shadow: 0 8px 18px rgba(250, 204, 21, 0.25);
      white-space: nowrap;
      backdrop-filter: blur(5px);
    }

    .btn:hover {
      background: #fbbf24;
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(250, 204, 21, 0.45);
    }

    .btn-outline {
      background: transparent;
      border: 2px solid #facc15;
      color: #facc15;
      box-shadow: none;
    }

    .btn-outline:hover {
      background: rgba(250, 204, 21, 0.08);
    }

    .teams-scroll {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.2rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 2rem;
      padding: 0.8rem 1.2rem;
    }

    .team-chip {
      background: #1e2538;
      border: 1px solid #3b4256;
      border-radius: 2rem;
      padding: 0.4rem 1rem 0.4rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      font-weight: 500;
      transition: 0.2s;
    }

    .team-chip span {
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .team-chip input {
      background: transparent;
      border: none;
      border-bottom: 1px dashed #64748b;
      color: white;
      font-weight: 500;
      font-size: 0.9rem;
      width: 100px;
      outline: none;
    }

    .team-chip button {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0 0.2rem;
      transition: 0.2s;
    }

    .team-chip button:hover {
      color: #f87171;
    }

    .bracket-container {
      background: rgba(0, 0, 0, 0.25);
      border-radius: 2.5rem;
      padding: 1.8rem 1rem;
      overflow-x: auto;
      overflow-y: visible;
      display: flex;
      justify-content: flex-start;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .bracket {
      display: flex;
      gap: 2.2rem;
      align-items: flex-start;
      padding: 0.5rem 1rem;
      min-width: max-content;
      margin: 0 auto;
    }

    .round {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      gap: 1.3rem;
      min-width: 175px;
    }

    .round-title {
      text-align: center;
      font-weight: 700;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #a5b4cb;
      margin-bottom: 0.3rem;
      background: rgba(255, 255, 255, 0.04);
      padding: 0.4rem 0.6rem;
      border-radius: 2rem;
      backdrop-filter: blur(10px);
    }

    .match {
      background: rgba(20, 26, 45, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 1.2rem;
      padding: 0.7rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s;
      box-shadow: 0 10px 20px -8px rgba(0,0,0,0.5);
    }

    .match-winner {
      border: 2px solid #facc15;
      background: rgba(250, 204, 21, 0.08);
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.3);
    }

    .team-slot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0b0f1c;
      border-radius: 2rem;
      padding: 0.45rem 0.9rem;
      font-weight: 500;
      font-size: 0.9rem;
      border: 1px solid transparent;
    }

    .team-name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .winner-badge {
      background: #facc15;
      color: #0f172a;
      border-radius: 2rem;
      padding: 0.15rem 0.7rem;
      font-weight: 700;
      font-size: 0.7rem;
      margin-left: 6px;
    }

    .select-winner-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid #4b5563;
      color: #cbd5e1;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.2s;
      margin-left: 4px;
    }

    .select-winner-btn:hover {
      background: #facc15;
      color: #0f172a;
      border-color: #facc15;
      font-weight: bold;
    }

    .empty-slot {
      color: #5f6b7c;
      font-style: italic;
    }

    @media (max-width: 750px) {
      .glass-panel {
        padding: 1.5rem;
      }
      .controls-grid {
        flex-direction: column;
        align-items: stretch;
      }
      .team-list-editor {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
<div class="glass-panel">
  <div class="header">
    <h1>
      🏆 ТУРНИРНАЯ СЕТКА
      <span class="badge" id="teamCountDisplay">16</span>
    </h1>
  </div>

  <div class="controls-grid">
    <div class="select-wrapper">
      <label>⚙️ Команд</label>
      <select id="teamCountSelect">
        <option value="4">4</option>
        <option value="8">8</option>
        <option value="16" selected>16</option>
        <option value="24">24</option>
        <option value="30">30</option>
      </select>
    </div>

    <div class="team-list-editor">
      <input type="text" id="newTeamNameInput" placeholder="Название новой команды" maxlength="30" />
      <button class="btn" id="addTeamBtn">➕ Добавить</button>
      <button class="btn btn-outline" id="resetDefaultBtn">🔄 По умолчанию</button>
      <button class="btn" id="generateBracketBtn">📋 Обновить сетку</button>
    </div>
  </div>

  <!-- Редактируемый список команд -->
  <div class="teams-scroll" id="teamChipsContainer"></div>

  <div class="bracket-container" id="bracketContainer">
    <div class="bracket" id="bracketRoot"></div>
  </div>
  <div style="color:#7f8ea3; font-size:0.8rem; text-align:center; margin-top:0.2rem;">
    💡 Нажмите на значок короны, чтобы выбрать победителя. Изменяйте названия прямо в списке выше.
  </div>
</div>

<script>
  (function() {
    // ---------- СОСТОЯНИЕ ----------
    let teamNames = [];                // массив строк
    let currentTeamCount = 16;
    let winners = new Map();          // "roundIndex-matchIndex" -> teamName

    // DOM элементы
    const teamCountSelect = document.getElementById('teamCountSelect');
    const teamCountDisplay = document.getElementById('teamCountDisplay');
    const newTeamNameInput = document.getElementById('newTeamNameInput');
    const addTeamBtn = document.getElementById('addTeamBtn');
    const resetDefaultBtn = document.getElementById('resetDefaultBtn');
    const generateBracketBtn = document.getElementById('generateBracketBtn');
    const bracketRoot = document.getElementById('bracketRoot');
    const teamChipsContainer = document.getElementById('teamChipsContainer');

    // ---------- УТИЛИТЫ ----------
    function getDefaultNames(count) {
      return Array.from({ length: count }, (_, i) => `Команда ${i + 1}`);
    }

    function syncTeamNamesToCount(newCount) {
      const old = [...teamNames];
      if (old.length !== newCount || old.length === 0) {
        const defaults = getDefaultNames(newCount);
        const updated = [];
        for (let i = 0; i < newCount; i++) {
          if (i < old.length && old[i] && old[i].trim() !== '') {
            updated.push(old[i]);
          } else {
            updated.push(defaults[i]);
          }
        }
        teamNames = updated;
      }
      if (teamNames.length !== newCount) {
        teamNames = getDefaultNames(newCount);
      }
    }

    function updateCountDisplay() {
      teamCountDisplay.textContent = currentTeamCount;
    }

    function resetWinners() {
      winners.clear();
    }

    function getTotalRounds(teamCount) {
      if (teamCount <= 1) return 0;
      let pow = 1, rounds = 0;
      while (pow < teamCount) { pow *= 2; rounds++; }
      return rounds;
    }

    function buildBracketStructure(teamCount, names) {
      if (!names || names.length !== teamCount) names = getDefaultNames(teamCount);
      const totalRounds = getTotalRounds(teamCount);
      if (totalRounds === 0) return [];

      let firstRoundSize = 1;
      while (firstRoundSize < teamCount) firstRoundSize *= 2;
      const firstRoundMatches = firstRoundSize / 2;
      const participants = [...names];
      while (participants.length < firstRoundSize) participants.push(null);

      const rounds = [];
      const round0 = [];
      for (let i = 0; i < firstRoundMatches; i++) {
        round0.push({
          teamA: participants[2 * i],
          teamB: participants[2 * i + 1],
          matchIndex: i,
          roundIndex: 0
        });
      }
      rounds.push(round0);

      for (let r = 1; r < totalRounds; r++) {
        const prevCount = rounds[r - 1].length;
        const current = [];
        for (let m = 0; m < prevCount / 2; m++) {
          current.push({ teamA: null, teamB: null, matchIndex: m, roundIndex: r });
        }
        rounds.push(current);
      }
      return rounds;
    }

    function getWinnerForMatch(roundIdx, matchIdx, teamA, teamB) {
      const key = `${roundIdx}-${matchIdx}`;
      if (winners.has(key)) return winners.get(key);
      if (teamA && !teamB) return teamA;
      if (!teamA && teamB) return teamB;
      return null;
    }

    function propagateWinners(rounds) {
      for (let r = 0; r < rounds.length - 1; r++) {
        const curr = rounds[r];
        const next = rounds[r + 1];
        for (let i = 0; i < curr.length; i += 2) {
          const m1 = curr[i];
          const m2 = curr[i + 1];
          const nextIdx = Math.floor(i / 2);
          if (nextIdx < next.length) {
            next[nextIdx].teamA = getWinnerForMatch(r, m1.matchIndex, m1.teamA, m1.teamB);
            next[nextIdx].teamB = getWinnerForMatch(r, m2.matchIndex, m2.teamA, m2.teamB);
          }
        }
      }
    }

    function escapeHtml(text) {
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // Установка победителя
    function setWinner(roundIdx, matchIdx, teamName) {
      if (!teamName) return;
      const key = `${roundIdx}-${matchIdx}`;
      winners.set(key, teamName);
      // удаляем все победители в более поздних раундах
      for (let [k] of winners) {
        const [rStr] = k.split('-');
        if (parseInt(rStr, 10) > roundIdx) winners.delete(k);
      }
      renderBracket();
    }

    // ---------- РЕНДЕРИНГ СЕТКИ ----------
    function renderBracket() {
      if (!teamNames.length || currentTeamCount === 0) {
        bracketRoot.innerHTML = '<div style="color:#94a3b8; padding:2rem;">Нет команд</div>';
        return;
      }
      const rounds = buildBracketStructure(currentTeamCount, teamNames);
      if (!rounds.length) {
        bracketRoot.innerHTML = '<div style="color:#94a3b8;">Недостаточно команд</div>';
        return;
      }
      propagateWinners(rounds);

      const totalRounds = rounds.length;
      const roundNames = [];
      if (totalRounds === 1) roundNames.push("Финал");
      else if (totalRounds === 2) { roundNames.push("Полуфиналы"); roundNames.push("Финал"); }
      else if (totalRounds === 3) { roundNames.push("1/4 финала"); roundNames.push("Полуфиналы"); roundNames.push("Финал"); }
      else if (totalRounds === 4) { roundNames.push("1/8 финала"); roundNames.push("1/4 финала"); roundNames.push("Полуфиналы"); roundNames.push("Финал"); }
      else if (totalRounds === 5) { roundNames.push("1/16 финала"); roundNames.push("1/8 финала"); roundNames.push("1/4 финала"); roundNames.push("Полуфиналы"); roundNames.push("Финал"); }
      else { for (let i=0;i<totalRounds;i++) roundNames.push(`Раунд ${i+1}`); }

      bracketRoot.innerHTML = '';
      rounds.forEach((round, rIdx) => {
        const roundDiv = document.createElement('div');
        roundDiv.className = 'round';
        const title = document.createElement('div');
        title.className = 'round-title';
        title.textContent = roundNames[rIdx] || `Раунд ${rIdx+1}`;
        roundDiv.appendChild(title);

        round.forEach(match => {
          const matchDiv = document.createElement('div');
          matchDiv.className = 'match';
          const winnerKey = `${rIdx}-${match.matchIndex}`;
          const currentWinner = getWinnerForMatch(rIdx, match.matchIndex, match.teamA, match.teamB);
          if (currentWinner) matchDiv.classList.add('match-winner');

          const createSlot = (team, isTeamA) => {
            const slot = document.createElement('div');
            slot.className = 'team-slot';
            const name = team || '———';
            slot.innerHTML = `<span class="team-name ${!team ? 'empty-slot' : ''}">${escapeHtml(name)}</span>`;
            if (team && currentWinner === team) {
              slot.innerHTML += '<span class="winner-badge">👑</span>';
            }
            if (team && !currentWinner && ((isTeamA && match.teamB) || (!isTeamA && match.teamA))) {
              const btn = document.createElement('button');
              btn.className = 'select-winner-btn';
              btn.innerHTML = '👑';
              btn.title = 'Выбрать победителем';
              btn.onclick = (e) => { e.stopPropagation(); setWinner(rIdx, match.matchIndex, team); };
              slot.appendChild(btn);
            } else if (team && !currentWinner && ((isTeamA && !match.teamB) || (!isTeamA && !match.teamA))) {
              if (!winners.has(winnerKey)) setWinner(rIdx, match.matchIndex, team);
            }
            return slot;
          };

          matchDiv.appendChild(createSlot(match.teamA, true));
          matchDiv.appendChild(createSlot(match.teamB, false));
          roundDiv.appendChild(matchDiv);
        });
        bracketRoot.appendChild(roundDiv);
      });
    }

    // ---------- РЕНДЕРИНГ РЕДАКТИРУЕМЫХ ЧИПСОВ ----------
    function renderTeamChips() {
      teamChipsContainer.innerHTML = '';
      if (!teamNames.length) return;

      teamNames.forEach((name, index) => {
        const chip = document.createElement('div');
        chip.className = 'team-chip';
        chip.innerHTML = `
          <span>${index + 1}.</span>
          <input type="text" value="${escapeHtml(name)}" data-index="${index}" class="team-name-input" maxlength="30" />
          <button class="delete-team-btn" data-index="${index}" title="Удалить команду">✕</button>
        `;
        teamChipsContainer.appendChild(chip);
      });

      // Обработчики изменения названия
      document.querySelectorAll('.team-name-input').forEach(input => {
        input.addEventListener('input', function(e) {
          const idx = parseInt(this.dataset.index, 10);
          if (!isNaN(idx) && idx < teamNames.length) {
            teamNames[idx] = this.value.trim() === '' ? `Команда ${idx+1}` : this.value.trim();
            // автоматически перерисовываем сетку при изменении имени
            renderBracket();
          }
        });
      });

      // Удаление команды
      document.querySelectorAll('.delete-team-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const idx = parseInt(this.dataset.index, 10);
          if (isNaN(idx) || teamNames.length <= 2) {
            alert("Минимум 2 команды необходимо.");
            return;
          }
          teamNames.splice(idx, 1);
          currentTeamCount = teamNames.length;
          teamCountSelect.value = currentTeamCount;
          syncTeamNamesToCount(currentTeamCount);
          resetWinners();
          renderTeamChips();
          renderBracket();
          updateCountDisplay();
        });
      });
    }

    // ---------- ОБЩИЕ ОБНОВЛЕНИЯ ----------
    function fullRefresh() {
      syncTeamNamesToCount(currentTeamCount);
      resetWinners();
      renderTeamChips();
      renderBracket();
      updateCountDisplay();
    }

    function onTeamCountChange() {
      const newCount = parseInt(teamCountSelect.value, 10);
      if (isNaN(newCount) || newCount < 2) return;
      currentTeamCount = newCount;
      syncTeamNamesToCount(currentTeamCount);
      resetWinners();
      renderTeamChips();
      renderBracket();
      updateCountDisplay();
    }

    function addTeam() {
      if (currentTeamCount >= 30) {
        alert('Максимум 30 команд.');
        return;
      }
      let name = newTeamNameInput.value.trim();
      if (!name) name = `Команда ${currentTeamCount + 1}`;
      teamNames.push(name);
      currentTeamCount = teamNames.length;
      teamCountSelect.value = currentTeamCount;
      resetWinners();
      renderTeamChips();
      renderBracket();
      updateCountDisplay();
      newTeamNameInput.value = '';
    }

    function resetToDefault() {
      teamNames = getDefaultNames(currentTeamCount);
      resetWinners();
      renderTeamChips();
      renderBracket();
    }

    // ---------- ИНИЦИАЛИЗАЦИЯ ----------
    function initialize() {
      currentTeamCount = 16;
      teamCountSelect.value = '16';
      teamNames = getDefaultNames(16);
      resetWinners();
      renderTeamChips();
      renderBracket();
      updateCountDisplay();
    }

    teamCountSelect.addEventListener('change', onTeamCountChange);
    addTeamBtn.addEventListener('click', addTeam);
    resetDefaultBtn.addEventListener('click', resetToDefault);
    generateBracketBtn.addEventListener('click', () => {
      syncTeamNamesToCount(currentTeamCount);
      resetWinners();
      renderTeamChips();
      renderBracket();
    });
    newTeamNameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addTeam();
    });

    initialize();
  })();
</script>
</body>
</html>
